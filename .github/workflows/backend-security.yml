name: Backend security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: RythmRun_backend_nodejs

jobs:
  backend-security:
    name: Backend security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/rythmrun_ci?schema=public
      JWT_SECRET: ci-access-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      NODE_ENV: test
      REFRESH_TOKEN_SECRET: ci-refresh-secret-0123456789-abcdefghijklmnopqrstuv
      RUN_DATABASE_INTEGRATION: '1'
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: rythmrun_ci
          POSTGRES_PASSWORD: ci
          POSTGRES_USER: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d rythmrun_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: RythmRun_backend_nodejs/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Validate Prisma schema
        run: npx --no-install prisma validate

      - name: Generate Prisma client
        run: npx --no-install prisma generate

      - name: Apply backend migrations to PostgreSQL
        run: npm run migrate:deploy

      - name: Type-check backend
        run: npm run typecheck

      - name: Run backend tests
        run: npm test -- --ci --runInBand

      - name: Build production backend
        run: npm run build

      - name: Smoke built ESM runtime
        run: npm run smoke:runtime
